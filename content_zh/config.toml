[site]
title = "王皓天 | Haotian Wang"
description = "香港理工大學土地測量及地理空間科學系博士生。我的研究以人本主义视角为核心，重点关注社会感知、人类时空行为及城市动态演化。通过整合多源大数据、神经生理学观测数据以及地理人工智能技术，探索以提升人类福祉为优先的可持续城市规划路径。"
